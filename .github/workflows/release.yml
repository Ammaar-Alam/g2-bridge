name: Release

# a version tag builds the Windows installer and opens a draft release to finish by hand
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-app.txt pyinstaller==6.22.3
      - run: python -m unittest discover -s tests
      - name: Check that the tag is the app version
        shell: bash
        run: test "$(python -c 'import goggles_bridge; print(goggles_bridge.__version__)')" = "$GITHUB_REF_NAME"
      - name: Install Inno Setup if the runner lacks it
        shell: bash
        run: test -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" || choco install innosetup --yes --no-progress
      - run: python packaging/build_windows.py
      - name: Draft the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          installer="dist/GogglesBridge-$tag-Setup.exe"
          sha="$(sha256sum "$installer" | cut -d ' ' -f 1)"
          previous="$(gh release list --exclude-drafts --limit 1 --json tagName -q '.[0].tagName // ""')"
          changelog="First release."
          if [ -n "$previous" ]; then
            # the merged pull requests since the last release, as "- [#12](link) title @author"
            pulls="$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$tag" -f previous_tag_name="$previous" -q .body \
              | sed -nE 's|^\* (.*) by @([^ ]+) in (https://[^ ]+/pull/([0-9]+))$|- [#\4](\3) \1 @\2|p')"
            changelog="Full Changelog: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$tag"$'\n\n'"$pulls"
          fi
          notes="$(cat .github/RELEASE_TEMPLATE.md)"
          notes="${notes//'{{VERSION}}'/$tag}"
          notes="${notes//'{{SHA256}}'/$sha}"
          notes="${notes//'{{CHANGELOG}}'/$changelog}"
          printf '%s\n' "$notes" > notes.md
          # pre-release until a stable version is declared; the title's headline is written by hand
          gh release create "$tag" "$installer" --draft --prerelease --verify-tag --title "$tag: " --notes-file notes.md
