name: Windows encoder

on:
  pull_request:
    paths:
      - vendor/ffmpeg/**
      - tools/build_windows_encoder.sh
      - .github/workflows/windows-encoder.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            curl tar xz make diffutils patch
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nasm
      - name: Build and check the helper
        shell: msys2 {0}
        run: bash tools/build_windows_encoder.sh
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: windows-encoder
          path: artifacts/windows-encoder/
          if-no-files-found: error
